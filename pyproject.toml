[project]
name = "sonar-gpu"
version = "0.1.0"
description = "GPU monitor TUI for macOS (Apple/MLX) and Linux (NVIDIA) that shows which project folder is using the GPU"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sushil Thapa", email = "xsushil@outlook.com" }]
keywords = ["gpu", "monitor", "tui", "apple-silicon", "mlx", "nvidia", "nvidia-smi", "htop", "metal"]
dependencies = ["rich>=13"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/Sushil-Thapa/sonar"
Repository = "https://github.com/Sushil-Thapa/sonar"
Issues = "https://github.com/Sushil-Thapa/sonar/issues"

[project.scripts]
sonar = "sonar.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sonar*"]
